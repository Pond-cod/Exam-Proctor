<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบบุคลากร (Staff Login) - Exam Proctor Studio</title>
  <meta name="description" content="ระบบเข้าสู่ระบบสำหรับครูผู้สอนและผู้ดูแลระบบ Exam Proctor Studio">
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="../css/style.css?v=5.7">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #f0fdf4 50%, #f8fafc 100%);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(226, 232, 240, 0.9);
      border-radius: 24px;
      padding: 34px 30px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12), 0 8px 18px -4px rgba(2, 132, 199, 0.08);
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .login-role-tabs {
      display: flex;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 22px;
      border: 1px solid #e2e8f0;
    }

    .role-tab-btn {
      flex: 1;
      min-height: 40px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .role-tab-btn.active {
      background: #ffffff;
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      font-weight: 700;
    }

    .role-tab-btn.active[data-role="ADMIN"] {
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .role-tab-btn.active[data-role="USER"] {
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .login-back-link {
      margin-top: 20px;
      text-align: center;
    }

    .login-back-link a {
      color: var(--text-muted);
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .login-back-link a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="../logo.png" alt="Exam Proctor Studio" class="login-brand-logo">
        <h1 style="font-size: 20px; font-weight: 800; color: var(--text-primary); margin: 0 0 4px 0;">เข้าสู่ระบบบุคลากร</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin: 0;">Exam Proctor Studio Management</p>
      </div>

      <!-- สลับบทบาท (Role Tabs) -->
      <div class="login-role-tabs" id="roleTabsContainer">
        <button type="button" class="role-tab-btn active" data-role="USER" id="roleTabTeacher">
          👨‍🏫 ครูผู้สอน / ผู้คุมสอบ
        </button>
        <button type="button" class="role-tab-btn" data-role="ADMIN" id="roleTabAdmin">
          🛡️ ผู้ดูแลระบบ (Admin)
        </button>
      </div>

      <form id="staffLoginForm" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="loginUsernameInput">ชื่อผู้ใช้ (Username / รหัสประจำตัว) <span style="font-size: 11px; color: var(--text-muted); font-weight: normal;">(ไม่บังคับ)</span></label>
          <input 
            type="text" 
            id="loginUsernameInput" 
            class="form-control" 
            placeholder="ตัวอย่าง: teacher หรือ admin"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="loginPasscodeInput" style="margin-bottom: 0;" id="passcodeLabelText">
              รหัสผ่าน / PIN (6 หลัก) *
            </label>
            <span id="roleHintBadge" class="badge badge-primary" style="font-size: 11px;">ครูผู้สอน</span>
          </div>
          <input 
            type="password" 
            id="loginPasscodeInput" 
            class="form-control" 
            placeholder="กรอกรหัส 6 หลัก (ครู: 111222, Admin: 999888)"
            autocomplete="current-password"
            required
            style="font-family: monospace; font-size: 20px; font-weight: 800; letter-spacing: 0.18em; text-align: center;"
          >
        </div>

        <div id="loginErrorMessage" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px;">
          รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
        </div>

        <button type="submit" id="submitLoginBtn" class="btn btn-primary btn-lg btn-block" style="font-weight: 700;">
          🚀 เข้าสู่ระบบ
        </button>
      </form>

      <div style="margin-top: 18px; padding: 12px; background: var(--bg-subtle); border-radius: var(--radius-sm); border: 1px solid #e2e8f0; font-size: 12px; color: var(--text-muted); line-height: 1.5;">
        💡 <strong>คำแนะนำเริ่มต้น:</strong><br>
        • สิทธิ์ครูผู้สอน: รหัสผ่านเริ่มต้นคือ <code>111222</code><br>
        • สิทธิ์ Admin: รหัสผ่านเริ่มต้นคือ <code>999888</code>
      </div>

      <div class="login-back-link">
        <a href="../index.html">
          ← กลับสู่หน้าศูนย์รวมข้อสอบนักเรียน
        </a>
      </div>
    </div>
  </div>

  <script src="../js/shared/config.js?v=5.7"></script>
  <script src="../js/backend/auth.js?v=5.7"></script>
  <script src="../js/shared/common.js?v=5.7"></script>
  <script>
    let selectedRole = USER_ROLES.TEACHER;

    document.addEventListener("DOMContentLoaded", () => {
      // ตรวจสอบว่าเข้าสู่ระบบอยู่แล้วหรือไม่ หากมี Session แล้วให้ข้ามไปหน้าปลายทาง
      if (typeof isLoggedIn === "function" && isLoggedIn()) {
        const params = new URLSearchParams(window.location.search);
        const redirectPage = params.get("redirect") || "rooms.html";
        window.location.replace(redirectPage);
        return;
      }

      const tabTeacher = document.getElementById("roleTabTeacher");
      const tabAdmin = document.getElementById("roleTabAdmin");
      const roleHint = document.getElementById("roleHintBadge");
      const passLabel = document.getElementById("passcodeLabelText");
      const passInput = document.getElementById("loginPasscodeInput");
      const userInput = document.getElementById("loginUsernameInput");
      const errBox = document.getElementById("loginErrorMessage");
      const form = document.getElementById("staffLoginForm");
      const submitBtn = document.getElementById("submitLoginBtn");

      // Switch Role Tabs
      function switchRole(role) {
        selectedRole = role;
        if (role === USER_ROLES.ADMIN) {
          tabAdmin.classList.add("active");
          tabTeacher.classList.remove("active");
          roleHint.textContent = "ผู้ดูแลระบบ (Admin)";
          roleHint.className = "badge badge-danger";
          passLabel.textContent = "รหัสผ่าน Master Admin Passcode *";
          if (!userInput.value) userInput.value = "admin";
        } else {
          tabTeacher.classList.add("active");
          tabAdmin.classList.remove("active");
          roleHint.textContent = "ครูผู้สอน";
          roleHint.className = "badge badge-primary";
          passLabel.textContent = "รหัสผ่านครูผู้สอน (Teacher Passcode) *";
          if (userInput.value === "admin") userInput.value = "";
        }
        errBox.style.display = "none";
        passInput.focus();
      }

      tabTeacher.addEventListener("click", () => switchRole(USER_ROLES.TEACHER));
      tabAdmin.addEventListener("click", () => switchRole(USER_ROLES.ADMIN));

      // Handle Form Submit
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = userInput.value.trim();
        const passcode = passInput.value.trim();

        if (!passcode) {
          errBox.textContent = "กรุณากรอกรหัสผ่าน";
          errBox.style.display = "block";
          passInput.focus();
          return;
        }

        submitBtn.disabled = true;
        const origBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = `<span class="btn-spinner"></span> กำลังตรวจสอบสิทธิ์...`;
        errBox.style.display = "none";

        try {
          const authResult = await authenticateUser({
            username: username,
            passcode: passcode,
            role: selectedRole
          });

          if (authResult.success && authResult.user) {
            setCurrentUser(authResult.user, true);

            // Redirect to destination
            const params = new URLSearchParams(window.location.search);
            const redirectPage = params.get("redirect") || "rooms.html";
            window.location.replace(redirectPage);
          } else {
            errBox.textContent = authResult.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
            errBox.style.display = "block";
            passInput.select();
            passInput.focus();
          }
        } catch (err) {
          errBox.textContent = "เกิดข้อผิดพลาดในการตรวจสอบ กรุณาลองใหม่อีกครั้ง";
          errBox.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origBtnText;
        }
      });
    });
  </script>
</body>
</html>
